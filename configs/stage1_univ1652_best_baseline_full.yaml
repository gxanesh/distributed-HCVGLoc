# stage1_univ1652_best_baseline_full.yaml
# 20-epoch single-GPU FULL run (Run A of the convergence-parity study).
# Identical hyperparameters to the smoke config; epochs and run name change.

exp_name: "single-gpu-baseline-univ1652-120ep"
output_dir: "experiments/single_gpu_baseline_univ1652_full"

model:
  descriptor_dim: 512
  fpn_out_ch: 256
  num_fpn_layers: 3
  num_slots: 8
  num_domains: 4

training:
  epochs: 20               # full run
  batch_size: 32           # per-GPU; matches smoke
  val_batch_size: 128
  num_workers: 8

  optimizer: adamw
  lr: 3.0e-4
  backbone_lr_scale: 0.1
  weight_decay: 0.01
  grad_clip: 1.0

  scheduler: warmup_cosine
  warmup_epochs: 5         # 5 ep warmup, then cosine decay over 15 ep to min_lr
  min_lr: 1.0e-6

  grl_warmup_epochs: 20
  grl_lambda_max: 0.1

  use_amp: true

  val_interval: 1
  log_interval: 25

  seed: 42

losses:
  temperature: 0.07
  lambda_nce: 1.0
  lambda_js: 0.0
  lambda_domain: 0.1
  lambda_rot: 0.2
  lambda_unc: 0.1

  use_memory_bank: true
  memory_bank_size: 8192
  infonce_symmetric: true
  infonce_hard_negative_weight: 0.5
  infonce_hard_negative_margin: 0.3
  infonce_label_smoothing: 0.1
  domain_label_smoothing: 0.1

data:
  train_datasets: [university1652]
  val_datasets:   [university1652]
  university1652_root: "/media/8TB-1/gs37r/research/uav-loc/all-datasets/University-1652"
  cvusa_root: "/media/8TB-1/gs37r/research/uav-loc/all-datasets/CVUSA"
  vigor_root: "/media/8TB-1/gs37r/research/uav-loc/all-datasets/VIGOR"
  cvact_root: "/media/8TB-1/gs37r/research/uav-loc/all-datasets/CVACT"

logging:
  use_wandb: true
  use_tensorboard: true
  wandb_project: "hcvgloc-distributed"
  wandb_entity: "w2c-lab"
  wandb_tags: ["convergence-parity", "single-gpu", "full"]
